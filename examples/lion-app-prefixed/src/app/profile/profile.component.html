<form (ngSubmit)="save()">
  <my-input label="Nom" name="name" [(ngModel)]="name"></my-input>
  <my-input-email label="E-mail" name="email" [(ngModel)]="email"></my-input-email>
  <my-select-rich label="Thème" name="theme" [(ngModel)]="theme">
    <my-option choice-value="light">Clair</my-option>
    <my-option choice-value="dark">Sombre</my-option>
  </my-select-rich>
  <my-checkbox label="Recevoir les actualités" name="optin" [(ngModel)]="optin"></my-checkbox>
  <my-button (click)="cancel()">Annuler</my-button>
  <my-button-submit>Enregistrer</my-button-submit>
</form>
